<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="utf-8">
  <title>NEZAM PRO - جاري التحميل</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(29, 78, 216, 0.4);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-icon {
      font-size: 36px;
      font-weight: 800;
    }
    .title {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 8px 0;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 32px;
    }
    .loader-bar {
      width: 240px;
      height: 4px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 10px;
      position: absolute;
      animation: loading 1.8s infinite ease-in-out;
    }
    .status-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 12px;
      font-weight: bold;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes loading {
      0% { left: -40%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <span class="logo-icon">N</span>
  </div>
  <div class="title">NEZAM PRO ERP & POS</div>
  <div class="subtitle">نظام نقاط البيع المطور لسطح المكتب</div>
  
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>
  
  <div class="status-text">جاري بدء تشغيل النظام والاتصال بالخادم...</div>
</body>
</html>
